name: Build Win Game Hub IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Sideloadable IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Bypass Node 24 Default)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          else
            echo "No package.json found. Skipping npm install."
          fi

      - name: Install CocoaPods (Conditional)
        run: |
          if [ -f "Podfile" ]; then
            echo "Podfile found. Installing CocoaPods dependencies..."
            pod install
          else
            echo "No Podfile found in the root directory. Skipping CocoaPods installation."
          fi

      - name: Build and Archive (Ad-Hoc / No Sign)
        run: |
          mkdir -p build
          
          # Intelligently determine whether to build a workspace or a project
          if [ -d "WinHub.xcworkspace" ]; then
            echo "Workspace detected. Building WinHub.xcworkspace..."
            xcodebuild -workspace WinHub.xcworkspace \
              -scheme WinHub \
              -configuration Release \
              -sdk iphoneos \
              -archivePath $PWD/build/WinHub.xcarchive \
              clean archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          elif [ -d "WinHub.xcodeproj" ]; then
            echo "Project detected. Building WinHub.xcodeproj..."
            xcodebuild -project WinHub.xcodeproj \
              -scheme WinHub \
              -configuration Release \
              -sdk iphoneos \
              -archivePath $PWD/build/WinHub.xcarchive \
              clean archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "Error: Could not find WinHub.xcworkspace or WinHub.xcodeproj in the root directory."
            echo "Here is the current directory structure for debugging:"
            ls -la
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          
          # Find the compiled .app file dynamically to avoid pathing errors
          APP_PATH=$(find build/WinHub.xcarchive/Products/Applications -name "*.app" -maxdepth 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Compiled .app file not found in the archive."
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          
          cd build
          zip -qr WinHub.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinHub-iOS-App
          path: build/WinHub.ipa
